name: Build Gozar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK and NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          yes | sdkmanager --licenses
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Locate and extract project
        run: |
          if [ -f gozar-android-source.zip ]; then
            unzip -q gozar-android-source.zip
          elif [ -f gozar-android-source-github-actions.zip ]; then
            unzip -q gozar-android-source-github-actions.zip
          elif [ -f gozar-android-source.zip.zip ]; then
            unzip -q gozar-android-source.zip.zip
          elif [ -d app/src/main ]; then
            echo "Project files appear to be at repository root"
          else
            echo "ZIP not found. Repository files:"
            ls -la
            exit 1
          fi

          if [ -d gozar-android ]; then
            echo "PROJECT_DIR=gozar-android" >> "$GITHUB_ENV"
          elif [ -d app/src/main ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "Could not find Android project"
            find . -maxdepth 3 -name build.gradle.kts
            exit 1
          fi

      - name: Prepare Xray core
        working-directory: gozar-android
        run: bash scripts/setup-xray-core.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: gozar-android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gozar-debug-APK
          path: gozar-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
